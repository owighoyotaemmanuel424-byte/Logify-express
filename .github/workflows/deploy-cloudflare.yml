name: Deploy Logify to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Configure Cloudflare Worker and D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);const db=(Array.isArray(x)?x:x.result||[]).find(d=>d.name==="logify-logs");if(!db?.uuid){console.error("D1 database logify-logs was not found");process.exit(1)}process.stdout.write(db.uuid)})')"
          cat > wrangler.jsonc <<EOF
{
  "\$schema": "./node_modules/wrangler/config-schema.json",
  "name": "logify-express",
  "main": "./worker/index.ts",
  "compatibility_date": "2026-08-13",
  "assets": {
    "not_found_handling": "single-page-application",
    "run_worker_first": ["/api/*"]
  },
  "d1_databases": [
    {
      "binding": "DB",
      "database_name": "logify-logs",
      "database_id": "${DB_ID}"
    }
  ]
}
EOF

      - name: Build application
        run: npm run build

      - name: Deploy database migrations and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply logify-logs --remote
          npx wrangler deploy

      - name: Verify production endpoint
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://logify-express.emmanuelowighoyota9.workers.dev/ \
            -o /dev/null
          echo "Production Worker is responding."
