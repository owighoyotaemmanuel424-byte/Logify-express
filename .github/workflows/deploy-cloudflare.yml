name: Deploy Logify to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.2.14

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: npm run typecheck --if-present
      - name: Build application
        run: npm run build
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Verify admin authentication configuration
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "Missing ADMIN_EMAIL secret"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "Missing ADMIN_PASSWORD secret"; exit 1; }
          test -n "$JWT_SECRET" || { echo "Missing JWT_SECRET secret"; exit 1; }
          test "${#ADMIN_PASSWORD}" -ge 12 || { echo "ADMIN_PASSWORD must be at least 12 characters"; exit 1; }
          test "${#JWT_SECRET}" -ge 32 || { echo "JWT_SECRET must be at least 32 characters"; exit 1; }
          echo "Admin authentication configuration is present."
      - name: Verify configured D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 info logify-logs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply logify-logs --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_EMAIL" | bunx wrangler secret put ADMIN_EMAIL
          printf '%s' "$ADMIN_PASSWORD" | bunx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$JWT_SECRET" | bunx wrangler secret put JWT_SECRET
          bunx wrangler deploy
      - name: Verify production health endpoint
        env:
          PRODUCTION_URL: https://logify-express.emmanuelowighoyota9.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/health"
          echo "Production Worker health check passed."
      - name: Verify admin login endpoint
        env:
          PRODUCTION_URL: https://logify-express.emmanuelowighoyota9.workers.dev
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          payload="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --retry 3 --retry-delay 2 -H 'Content-Type: application/json' -X POST "$PRODUCTION_URL/api/auth/login" --data "$payload")"
          cat "$response_file"
          echo
          test "$http_code" = "200" || { echo "Admin login verification failed with HTTP $http_code"; exit 1; }
          jq -e '.token and (.user.role == "super_admin")' "$response_file" >/dev/null || { echo "Admin login response did not contain the expected authenticated admin payload"; exit 1; }
          echo "Production admin login verification passed."